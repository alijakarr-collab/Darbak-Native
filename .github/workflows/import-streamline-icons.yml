name: Import licensed Streamline Nova icons
on:
  push:
    paths:
      - .github/workflows/import-streamline-icons.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install PNG converter
        run: python3 -m pip install --quiet cairosvg
      - name: Download exact Streamline SVG assets and rasterize into bundled Android PNGs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable-nodpi
          mkdir -p /tmp/darbak-icons
          curl -fL --retry 2 -o /tmp/darbak-icons/settings.svg 'https://public-api.streamlinehq.com/v1/mcp/download/bbCw4EFaL5t5nbC7QAx2Fg'
          curl -fL --retry 2 -o /tmp/darbak-icons/gauge.svg 'https://public-api.streamlinehq.com/v1/mcp/download/gvK4WUkwfmX7GXbsxM7Nmg'
          curl -fL --retry 2 -o /tmp/darbak-icons/nav.svg 'https://public-api.streamlinehq.com/v1/mcp/download/-Z5UxOEyBcZbnnnZm9XPEw'
          curl -fL --retry 2 -o /tmp/darbak-icons/volume.svg 'https://public-api.streamlinehq.com/v1/mcp/download/0efBGCOxkoy19K9PveUUYg'
          curl -fL --retry 2 -o /tmp/darbak-icons/car.svg 'https://public-api.streamlinehq.com/v1/mcp/download/Pexl2pDLTbS9q5PLcmS8zA'
          python3 - <<'PY'
          import cairosvg
          from pathlib import Path
          names = {'settings':'ic_darbak_settings','gauge':'ic_darbak_gauge','nav':'ic_darbak_navigation','volume':'ic_darbak_volume','car':'ic_darbak_car'}
          for source,name in names.items():
              data=Path('/tmp/darbak-icons/'+source+'.svg').read_bytes()
              if b'<svg' not in data:
                  raise RuntimeError('Invalid SVG: '+source)
              dest=Path('app/src/main/res/drawable-nodpi')/(name+'.png')
              cairosvg.svg2png(bytestring=data,write_to=str(dest),output_width=128,output_height=128)
              if not dest.read_bytes().startswith(b'\x89PNG\r\n\x1a\n'):
                  raise RuntimeError('Invalid PNG: '+name)
              print(name, dest.stat().st_size)
          PY
      - name: Commit bundled, permanent offline icons
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/drawable-nodpi
          if ! git diff --cached --quiet; then
            git commit -m "Bundle five Streamline Nova free navigation UI icons as PNG"
            git push
          fi

name: Build Darbak 4.2 Pro user source
on:
  push:
    branches: [build-v4-2-pro-upload]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android command-line SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          curl -fsSL --retry 3 -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdtools
          mv /tmp/cmdtools/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Restore user v4.2 files unchanged and verify exact SHA-256
        shell: bash
        run: |
          set -euo pipefail
          cat upload/chunk_{00..16}.b64 | tr -d '\n' | base64 -d > /tmp/darbak42.tar.br
          echo "8430304a87396898ff946cced1d1e8b61c14d95a4bdec6439fb4a5b721f2738e  /tmp/darbak42.tar.br" | sha256sum -c -
          python3 -m venv /tmp/darbak-br-venv
          /tmp/darbak-br-venv/bin/pip -q install brotli
          /tmp/darbak-br-venv/bin/python - <<'PY'
          import brotli
          from pathlib import Path
          Path('/tmp/darbak42.tar').write_bytes(brotli.decompress(Path('/tmp/darbak42.tar.br').read_bytes()))
          PY
          mkdir -p /tmp/darbak42-project
          tar -xf /tmp/darbak42.tar -C /tmp/darbak42-project --no-same-owner
          mkdir -p /tmp/darbak42-project/app/src/main/res/raw
          cp app/src/main/res/raw/{arrived,turn_left,turn_right}.mp3 /tmp/darbak42-project/app/src/main/res/raw/
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          root=Path('/tmp/darbak42-project')
          lines=[]
          for path in root.rglob('*'):
              if path.is_file():
                  rel=path.relative_to(root).as_posix()
                  lines.append(rel+'\t'+sha256(path.read_bytes()).hexdigest())
          actual=sha256(('\n'.join(sorted(lines))+'\n').encode()).hexdigest()
          expected='7bb0e00478ba3fe7e7be32c58a593a0262d20495706fd2352038e2e5774be69e'
          print('Files:',len(lines),'Manifest:',actual)
          if actual!=expected or len(lines)!=71:
              raise SystemExit('Source mismatch: refusing to build altered user code.')
          print('All 71 source files match the uploaded v4.2 archive byte-for-byte.')
          PY
      - name: Verify bundled Iraqi voice recordings
        run: |
          for clip in app/src/main/res/raw/turn_left.mp3 app/src/main/res/raw/turn_right.mp3 app/src/main/res/raw/arrived.mp3; do
            test -s "$clip"
            file "$clip"
          done
      - name: Assemble signed debug APK
        run: gradle --no-daemon --project-dir /tmp/darbak42-project :app:assembleDebug --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Darbak-v4.2-Pro-APK
          path: /tmp/darbak42-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
